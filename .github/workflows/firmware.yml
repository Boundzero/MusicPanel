name: Build firmware

# Builds the firmware and a merged image with ESP-IDF. Runs on pushes to main,
# on manual dispatch, and on published releases (where it also attaches the
# merged .bin to the release).

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32s3
          command: idf.py build && idf.py merge-bin -o musicpanel-merged.bin

      - name: Upload merged binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicpanel-merged
          path: musicpanel-merged.bin
          if-no-files-found: error

      - name: Attach binary to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: musicpanel-merged.bin

# Note: this produces the artifact/release asset. To update the *web installer*,
# download musicpanel-merged.bin, drop it in docs/firmware/, bump the version in
# docs/manifest.json, and commit. (Committing binaries into docs/ keeps GitHub
# Pages self-contained.)
